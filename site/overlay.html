<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kyoto Client - stream overlay</title>
<!--
  OBS / TikTok LIVE Studio / Streamlabs: add a Browser Source, 1920 x 1080.
  Easiest: open kyoto-server.onrender.com/overlay/setup, pick everything, copy the link.

  ?mode=pop     card that pops up in a corner (default)
        badge   small always-on corner badge
        bar     lower-third bar with a scrolling ticker
        scene   full screen: Starting soon / BRB / Ending (use with ?scene=start|brb|end&timer=5)
        qr      just the "scan to get Kyoto" card
  Live game overlays (need ?k=<overlay key> from the setup page + "Live Stats For Overlays" on in Kyoto):
        challenge  money goal, e.g. 2xing: &start=1m&goal=2m&title=2xing my money (&from=session counts money made)
        stats      live server stats card (&show=money,session,perhour,kills,deaths,bounty)
        alerts     big pop-ups for bounty on you, deaths, kills, AH sold, orders filled (&events=bounty,death)
        counter    one big number (&what=deaths|kills|money|session|perhour|bounty|shards|hearts|elo&label=Deaths today)
  Vertical streams (TikTok LIVE, Shorts): add ?layout=vertical and make the Browser Source 1080 x 1920.
    It keeps clear of TikTok's top bar, side buttons and the comments. pos=top|mid|bottom (+ tl/tr/bl/br)
  ?pos=br|bl|tr|tl|bottom|top   ?scale=1 (0.5-2)   ?every=45 (seconds between pop-ups, 0 = always up)   ?show=14
  ?name=YourMinecraftName   adds your level card     ?theme=sakura|night|sunset|mint|mono
  ?slides=brand,get,live,feature,me,studio,launcher   ?title=Custom text (scene)   ?qr=0 hides QR codes
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --s: 1; --a: #ff8fd0; --b: #a98bff; --c: #8fd8ff; --ink: #0c0716; --glass: rgba(14, 9, 26, .78); --ease: cubic-bezier(.16, 1, .3, 1); --pop: cubic-bezier(.34, 1.56, .64, 1); }
  .t-night { --a: #7c9bff; --b: #6a5cff; --c: #8fe7ff; } .t-sunset { --a: #ffb05c; --b: #ff5d8f; --c: #ffd36b; }
  .t-mint { --a: #6dffc0; --b: #45d8ff; --c: #b8ffdf; } .t-mono { --a: #ffffff; --b: #b9bcc6; --c: #e8eaf0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Poppins, "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .grad-text { background: linear-gradient(100deg, #fff 10%, var(--a) 45%, var(--b) 70%, var(--c)); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s ease-in-out infinite; }
  @keyframes shimmer { 50% { background-position: 100% 0; } }

  /* ============ placement ============ */
  .anchor { position: fixed; padding: 56px; }
  .br { right: 0; bottom: 0; } .bl { left: 0; bottom: 0; } .tr { right: 0; top: 0; } .tl { left: 0; top: 0; }
  .bottom { left: 50%; bottom: 0; transform: translateX(-50%); } .top { left: 50%; top: 0; transform: translateX(-50%); }
  .sc { transform: scale(var(--s)); }
  .br .sc { transform-origin: right bottom; } .bl .sc { transform-origin: left bottom; } .tr .sc { transform-origin: right top; } .tl .sc { transform-origin: left top; }
  .bottom .sc { transform-origin: center bottom; } .top .sc { transform-origin: center top; }

  /* ============ shared glass shell with a spinning gradient edge ============ */
  .shell { position: relative; isolation: isolate; border-radius: 34px; }
  .shell .edge { position: absolute; inset: -2px; border-radius: inherit; z-index: -2; overflow: hidden; padding: 2px; }
  .shell .edge::before { content: ''; position: absolute; inset: -80%; background: conic-gradient(from 0deg, var(--a), var(--b), var(--c), rgba(255,255,255,.7), var(--a)); animation: spin 5s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .shell .glow { position: absolute; inset: 10px; border-radius: inherit; z-index: -3; background: conic-gradient(from 0deg, var(--a), var(--b), var(--c), var(--a)); filter: blur(34px); opacity: .45; animation: spin 5s linear infinite, breathe 3.5s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .7; } }
  .shell .bg { position: absolute; inset: 0; border-radius: inherit; z-index: -1; overflow: hidden; background: radial-gradient(140% 140% at 0% 0%, color-mix(in srgb, var(--b) 38%, #1a0e30) 0%, #110a20 45%, #07040d 100%); box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
  .shell .bg::before { content: ''; position: absolute; inset: -40%; background: radial-gradient(28% 38% at 22% 40%, color-mix(in srgb, var(--a) 50%, transparent), transparent 70%), radial-gradient(30% 40% at 72% 72%, color-mix(in srgb, var(--c) 34%, transparent), transparent 70%), radial-gradient(24% 34% at 80% 18%, color-mix(in srgb, var(--b) 40%, transparent), transparent 70%); filter: blur(16px); animation: drift 10s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(6%, -5%) rotate(12deg) scale(1.08); } }
  .shell .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 7s ease-in-out infinite 1.5s; }
  @keyframes sheen { 0%, 60% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
  canvas.stars { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; border-radius: inherit; pointer-events: none; }

  /* ============ POP card ============ */
  .pop { width: 760px; height: 212px; opacity: 0; transform: translateY(40px) scale(.86) rotate(var(--tilt, 1.5deg)); filter: blur(12px); transition: opacity .55s ease, transform 1s var(--pop), filter .55s ease; }
  .bl .pop, .tl .pop { --tilt: -1.5deg; } .bottom .pop, .top .pop { --tilt: 0deg; }
  .tr .pop, .tl .pop, .top .pop { transform: translateY(-40px) scale(.86) rotate(var(--tilt, 1.5deg)); }
  .pop.on { opacity: 1; transform: none; filter: none; }
  .pop.out { opacity: 0; transform: translateY(24px) scale(.94); filter: blur(8px); transition: opacity .45s ease, transform .55s ease, filter .45s; }
  .pop .inner { position: absolute; inset: 0; display: grid; grid-template-columns: 180px 1fr; align-items: center; gap: 26px; padding: 0 34px 0 22px; }
  .art { position: relative; width: 168px; height: 168px; display: grid; place-items: center; }
  .art > * { position: absolute; inset: 0; margin: auto; transition: opacity .5s ease, transform .8s var(--pop), filter .5s; }
  .art > .hide { opacity: 0; transform: scale(.6) rotate(-14deg); filter: blur(6px); }
  .tile { width: 150px; height: 150px; border-radius: 36px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.03)); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 16px 40px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12); }
  .tile img.logo { width: 118px; height: 118px; border-radius: 28px; animation: float 4s ease-in-out infinite; filter: drop-shadow(0 8px 20px color-mix(in srgb, var(--a) 60%, transparent)); }
  @keyframes float { 50% { transform: translateY(-6px) rotate(-2deg); } }
  .tile.qrt { background: #fff; padding: 12px; } .tile.qrt svg { width: 100%; height: 100%; }
  .tile.qrt::after { content: ''; position: absolute; inset: -6px; border-radius: 40px; border: 2px solid var(--a); animation: ping 2.2s ease-out infinite; }
  @keyframes ping { from { opacity: .9; transform: scale(.96); } to { opacity: 0; transform: scale(1.14); } }
  .tile.big { font: 800 62px/1 Poppins; letter-spacing: -2px; } .tile.big small { display: block; font-size: 13px; letter-spacing: .14em; font-weight: 700; color: rgba(255,255,255,.7); margin-top: 4px; text-align: center; }
  .tile.head img { width: 112px; height: 112px; image-rendering: pixelated; border-radius: 18px; animation: float 4s ease-in-out infinite; }
  .tile.feat svg { width: 76px; height: 76px; color: #fff; filter: drop-shadow(0 6px 18px var(--a)); animation: float 4s ease-in-out infinite; }
  .ring { position: absolute; inset: 0; } .ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
  .text { position: relative; min-width: 0; height: 160px; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; }
  .slide > * { opacity: 0; transform: translateY(16px); filter: blur(4px); transition: opacity .5s ease, transform .7s var(--ease), filter .5s; }
  .slide.in > * { opacity: 1; transform: none; filter: none; }
  .slide.in > *:nth-child(2) { transition-delay: .08s; } .slide.in > *:nth-child(3) { transition-delay: .16s; } .slide.in > *:nth-child(4) { transition-delay: .24s; }
  .slide.leave > * { opacity: 0; transform: translateY(-14px); filter: blur(4px); transition-duration: .35s; transition-delay: 0s !important; }
  .eyebrow { display: flex; align-items: center; gap: 9px; font: 700 14px Poppins; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.78); }
  .pill { padding: 4px 11px; border-radius: 999px; font-size: 12px; letter-spacing: .12em; color: var(--ink); background: linear-gradient(135deg, #fff, var(--a)); box-shadow: 0 4px 14px color-mix(in srgb, var(--a) 50%, transparent); }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #ff4d6d; box-shadow: 0 0 0 0 rgba(255,77,109,.7); animation: live 1.6s infinite; }
  .dot.g { background: #3ddc84; animation-name: liveg; }
  @keyframes live { 70% { box-shadow: 0 0 0 9px rgba(255,77,109,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,109,0); } }
  @keyframes liveg { 0% { box-shadow: 0 0 0 0 rgba(61,220,132,.7); } 70% { box-shadow: 0 0 0 9px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
  .title { margin: 4px 0 2px; font: 800 50px/1.08 Poppins; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 4px; }
  .title.site { font: 700 31px/1.3 'JetBrains Mono', monospace; letter-spacing: -1px; margin: 8px 0 6px; }
  .eyebrow svg { width: 17px; height: 17px; flex: none; color: var(--a); }
  .badge .rot svg { width: 16px; height: 16px; flex: none; color: var(--a); }
  .scene .card small svg { width: 16px; height: 16px; color: var(--a); }
  .sub { font: 500 20px/1.35 Poppins; color: rgba(255,255,255,.86); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .sub b { color: #fff; font-weight: 700; }
  .chips { display: flex; gap: 8px; margin-top: 12px; } .chips span { padding: 5px 12px; border-radius: 999px; font: 600 13px Poppins; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.92); display: inline-flex; align-items: center; gap: 6px; }
  .chips svg { width: 14px; height: 14px; }
  .timeline { position: absolute; left: 22px; right: 22px; bottom: 12px; height: 3px; display: flex; gap: 6px; }
  .timeline i { flex: 1; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; } .timeline i b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--a), var(--c)); }
  .timeline i.done b { width: 100%; } .timeline i.run b { animation: fill linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .sparks { position: absolute; inset: -30px; pointer-events: none; z-index: 5; }

  /* ============ BADGE ============ */
  .badge { display: flex; align-items: center; gap: 14px; height: 78px; padding: 0 26px 0 12px; border-radius: 24px; animation: badgeIn 1s var(--pop) both; }
  @keyframes badgeIn { from { opacity: 0; transform: scale(.7) translateY(20px); filter: blur(8px); } }
  .badge img { width: 54px; height: 54px; border-radius: 15px; animation: float 4s ease-in-out infinite; }
  .badge .bt { display: grid; } .badge b { font: 800 22px/1.1 Poppins; } .badge .rot { position: relative; height: 22px; min-width: 300px; overflow: hidden; font: 600 15px/22px Poppins; color: rgba(255,255,255,.85); }
  .badge .rot span { position: absolute; left: 0; top: 0; white-space: nowrap; display: flex; align-items: center; gap: 7px; transition: transform .7s var(--ease), opacity .5s; } .badge .rot span.up { transform: translateY(-110%); opacity: 0; } .badge .rot span.down { transform: translateY(110%); opacity: 0; }
  .badge .rot .site { font-family: 'JetBrains Mono', monospace; font-size: 15px; }

  /* ============ BAR ============ */
  .barwrap { position: fixed; left: 56px; right: 56px; bottom: 44px; display: flex; justify-content: center; }
  .bar { width: 100%; max-width: 1700px; height: 104px; border-radius: 30px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; animation: barIn 1.1s var(--ease) both; transform-origin: bottom center; }
  @keyframes barIn { from { opacity: 0; transform: translateY(60px) scaleX(.6); filter: blur(10px); } }
  .bar .brand { display: flex; align-items: center; gap: 16px; padding: 0 28px 0 18px; height: 100%; border-right: 1px solid rgba(255,255,255,.12); }
  .bar .brand img { width: 70px; height: 70px; border-radius: 19px; } .bar .brand b { display: block; font: 800 28px/1 Poppins; } .bar .brand span { font: 600 14px Poppins; color: rgba(255,255,255,.8); display: flex; align-items: center; gap: 7px; margin-top: 4px; }
  .marquee { position: relative; overflow: hidden; height: 100%; mask: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .marquee .track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center; gap: 0; white-space: nowrap; animation: scroll linear infinite; will-change: transform; }
  .marquee .item { display: inline-flex; align-items: center; gap: 12px; padding: 0 26px; font: 600 23px Poppins; } .marquee .item svg { width: 26px; height: 26px; color: var(--a); } .marquee .item b { font-weight: 800; }
  .marquee .sep { width: 9px; height: 9px; border-radius: 3px; background: linear-gradient(135deg, var(--a), var(--c)); transform: rotate(45deg); }
  @keyframes scroll { to { transform: translateX(-50%); } }
  .bar .get { display: flex; align-items: center; gap: 14px; padding: 0 14px 0 26px; height: 100%; border-left: 1px solid rgba(255,255,255,.12); }
  .bar .get .q { width: 78px; height: 78px; border-radius: 14px; background: #fff; padding: 6px; } .bar .get small { display: block; font: 700 12px Poppins; letter-spacing: .16em; color: rgba(255,255,255,.7); } .bar .get b { font: 700 19px 'JetBrains Mono', monospace; }

  /* ============ QR card ============ */
  .qrc { display: flex; align-items: center; gap: 20px; padding: 18px 28px 18px 18px; border-radius: 30px; animation: badgeIn 1s var(--pop) both; }
  .qrc .q { position: relative; width: 150px; height: 150px; border-radius: 20px; background: #fff; padding: 10px; } .qrc .q::after { content: ''; position: absolute; inset: -6px; border-radius: 24px; border: 2px solid var(--a); animation: ping 2.2s ease-out infinite; }
  .qrc .q img { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 9px; border: 3px solid #fff; }
  .qrc small { font: 700 13px Poppins; letter-spacing: .16em; color: rgba(255,255,255,.75); } .qrc b { display: block; font: 800 34px/1.1 Poppins; margin: 4px 0; } .qrc code { font: 600 18px 'JetBrains Mono', monospace; color: rgba(255,255,255,.9); }

  /* ============ SCENE (full screen) ============ */
  .scene { position: fixed; inset: 0; background: #06030c; overflow: hidden; }
  .scene .art-bg { position: absolute; inset: -4%; background-size: cover; background-position: center; filter: saturate(1.15) brightness(.75); animation: kenburns 40s ease-in-out infinite alternate; }
  @keyframes kenburns { to { transform: scale(1.12) translate(-2%, -1%); } }
  .scene .tint { position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 40%, transparent, rgba(6,3,12,.7)), linear-gradient(180deg, rgba(6,3,12,.1), rgba(6,3,12,.7)); }
  .scene canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .center { position: absolute; left: 0; right: 0; top: 150px; display: grid; justify-items: center; text-align: center; }
  .scene .biglogo { position: relative; width: 190px; height: 190px; animation: rise 1.4s var(--pop) both; }
  .scene .biglogo img { width: 100%; height: 100%; border-radius: 48px; box-shadow: 0 30px 90px color-mix(in srgb, var(--a) 45%, transparent); animation: float 5s ease-in-out infinite; }
  .scene .biglogo::before { content: ''; position: absolute; inset: -30px; border-radius: 70px; background: conic-gradient(var(--a), var(--b), var(--c), var(--a)); filter: blur(50px); opacity: .5; animation: spin 8s linear infinite; z-index: -1; }
  @keyframes rise { from { opacity: 0; transform: translateY(50px) scale(.8); filter: blur(10px); } }
  .scene .kicker { margin-top: 44px; font: 700 22px Poppins; letter-spacing: .4em; text-transform: uppercase; color: rgba(255,255,255,.8); animation: rise 1.2s .2s var(--ease) both; display: flex; align-items: center; gap: 14px; }
  .scene h1 { margin: 10px 0 0; font: 900 132px/1 Poppins; letter-spacing: -3px; animation: rise 1.2s .3s var(--ease) both; text-shadow: 0 20px 80px rgba(0,0,0,.5); }
  .scene .timer { margin-top: 18px; font: 700 64px 'JetBrains Mono', monospace; letter-spacing: 2px; animation: rise 1.2s .45s var(--ease) both; display: flex; gap: 4px; }
  .scene .timer span { display: inline-block; min-width: .62em; text-align: center; padding: 6px 4px; border-radius: 14px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); }
  .scene .timer i { font-style: normal; opacity: .6; padding: 6px 0; }
  .scene .timer span.flip { animation: flip .5s var(--ease); } @keyframes flip { from { transform: rotateX(90deg); opacity: .2; } }
  .scene .row { position: absolute; left: 90px; right: 90px; bottom: 160px; display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 26px; align-items: stretch; }
  .scene .card { position: relative; padding: 26px 28px; border-radius: 30px; animation: rise 1.2s var(--ease) both; min-height: 210px; }
  .scene .card:nth-child(1) { animation-delay: .6s; } .scene .card:nth-child(2) { animation-delay: .7s; } .scene .card:nth-child(3) { animation-delay: .8s; }
  .scene .card small { font: 700 14px Poppins; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.72); display: flex; align-items: center; gap: 9px; }
  .scene .getc { display: flex; align-items: center; gap: 24px; } .scene .getc .q { flex: none; width: 158px; height: 158px; border-radius: 20px; background: #fff; padding: 10px; }
  .scene .getc b { display: block; font: 800 34px/1.1 Poppins; margin: 8px 0 6px; } .scene .getc code { font: 700 19px 'JetBrains Mono', monospace; white-space: nowrap; } .scene .getc p { margin: 8px 0 0; font: 500 16px Poppins; color: rgba(255,255,255,.8); }
  .scene .featc { overflow: hidden; } .scene .fslot { position: relative; height: 150px; margin-top: 10px; }
  .scene .fslot > div { position: absolute; inset: 0; display: grid; grid-template-columns: 96px 1fr; gap: 22px; align-items: center; transition: opacity .6s, transform .8s var(--ease); }
  .scene .fslot > div.hide { opacity: 0; transform: translateX(40px); } .scene .fslot > div.gone { opacity: 0; transform: translateX(-40px); }
  .scene .fslot .fi { width: 96px; height: 96px; border-radius: 26px; display: grid; place-items: center; background: linear-gradient(145deg, color-mix(in srgb, var(--a) 40%, transparent), color-mix(in srgb, var(--b) 25%, transparent)); border: 1px solid rgba(255,255,255,.18); }
  .scene .fslot .fi svg { width: 48px; height: 48px; } .scene .fslot b { display: block; font: 800 36px/1.1 Poppins; } .scene .fslot p { margin: 6px 0 0; font: 500 18px/1.4 Poppins; color: rgba(255,255,255,.85); }
  .scene .fdots { display: flex; gap: 6px; margin-top: 8px; } .scene .fdots i { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.2); transition: width .4s, background .4s; } .scene .fdots i.on { width: 26px; background: var(--a); }
  .scene .livec .num { font: 900 92px/1 Poppins; letter-spacing: -3px; margin-top: 12px; } .scene .livec p { margin: 4px 0 0; font: 600 20px Poppins; color: rgba(255,255,255,.85); }
  .scene .livec .me { display: flex; align-items: center; gap: 14px; margin-top: 4px; } .scene .livec .me img { width: 86px; height: 86px; image-rendering: pixelated; border-radius: 16px; }
  .scene .livec .me b { display: block; font: 800 30px Poppins; } .scene .livec .me span { font: 600 17px Poppins; color: rgba(255,255,255,.8); }
  .scene .ticker { position: absolute; left: 0; right: 0; bottom: 52px; height: 64px; overflow: hidden; mask: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .scene .ticker .track { animation-duration: 60s; }
  .scene .ticker .item { font-size: 22px; color: rgba(255,255,255,.88); }

  /* ============ VERTICAL (1080 x 1920) ============ */
  /* TikTok covers roughly: top 250px (host + viewers), right 150px (buttons), bottom 620px (comments + gifts) */
  .vert .anchor { padding: 40px; }
  .vert .anchor.tl, .vert .anchor.tr, .vert .anchor.top { top: 250px; } .vert .anchor.tr, .vert .anchor.br { right: 130px; }
  .vert .anchor.bl, .vert .anchor.br, .vert .anchor.bottom { bottom: 600px; }
  .vert .anchor.mid { left: 50%; top: 50%; transform: translate(-50%, -50%); } .vert .mid .sc { transform-origin: center; }
  .vert .anchor.top, .vert .anchor.bottom { left: 0; right: 130px; transform: none; display: flex; justify-content: center; }
  .vert .pop { width: 800px; height: 200px; } .vert .pop .inner { grid-template-columns: 160px 1fr; gap: 22px; }
  .vert .art { width: 150px; height: 150px; } .vert .tile { width: 138px; height: 138px; } .vert .tile img.logo { width: 108px; height: 108px; }
  .vert .title { font-size: 46px; } .vert .title.site { font-size: 28px; } .vert .sub { font-size: 19px; }
  .vert .barwrap { left: 30px; right: 130px; top: 260px; bottom: auto; }
  .vert .bar { height: 96px; grid-template-columns: auto 1fr; } .vert .bar .get { display: none; } .vert .bar .brand b { font-size: 25px; } .vert .bar .brand img { width: 62px; height: 62px; }
  .vert .marquee .item { font-size: 21px; }
  /* full scene, stacked */

const SCALE_IN = Math.min(2, Math.max(.5, Number(Q.get('scale')) || 1));

const SHOW = Math.max(6, Number(Q.get('show')) || 15);
const NAME = /^[A-Za-z0-9_]{2,16}$/.test(Q.get('name') || '') ? Q.get('name') : '';

const SITE = (Q.get('site') || 'kyoto-server.onrender.com').replace(/^https?:\/\//, '').replace(/\/$/, '');

const LOGO = '/img/logos/torii_' + (() => { const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
  if (m === 12 && day >= 27 || m === 1 && day <= 2) return 'newyear'; if (m === 12) return 'christmas'; if (m === 10 && day >= 15) return 'halloween';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- icons ---------------- */

/* ---------------- live data ---------------- */
const DATA = { online: null, users: null, version: '', card: null };
async function get(p) { const r = await fetch(API + p, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return r.json(); }

}
refresh(); setInterval(refresh, 30000);

/* ---------------- star field (shared) ---------------- */
function stars(canvas, n = 50, big = false) {
  const g = canvas.getContext('2d'); let W, H, pts = [], shoot = null;
  const fit = () => { const r = devicePixelRatio || 1; W = canvas.width = canvas.clientWidth * r; H = canvas.height = canvas.clientHeight * r; pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * (big ? 1.8 : 1.2) + .3) * r, t: Math.random() * 6, s: .4 + Math.random() * 1.2, v: (Math.random() * .15 + .03) * r })); };
  fit(); addEventListener('resize', fit);
  (function f(t) {
    g.clearRect(0, 0, W, H);
    for (const p of pts) { const a = .25 + .75 * Math.abs(Math.sin(p.t + t / 1000 * p.s)); g.globalAlpha = a; g.fillStyle = '#fff'; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.29); g.fill(); if (big) { p.y -= p.v; if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; } } }
    if (!shoot && Math.random() < (big ? .006 : .002)) shoot = { x: Math.random() * W * .7, y: Math.random() * H * .4, l: 0 };
    if (shoot) { shoot.l += 0.025; const x = shoot.x + shoot.l * W * .35, y = shoot.y + shoot.l * H * .18; const gr = g.createLinearGradient(x - 120, y - 60, x, y); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,.9)'); g.globalAlpha = 1 - shoot.l; g.strokeStyle = gr; g.lineWidth = 2; g.beginPath(); g.moveTo(x - 120, y - 60); g.lineTo(x, y); g.stroke(); if (shoot.l >= 1) shoot = null; }
    g.globalAlpha = 1; requestAnimationFrame(f);
  })(0);
}
const shell = (cls, inner, starsN = 40) => `<div class="shell ${cls}"><div class="glow"></div><div class="edge"></div><div class="bg"></div><canvas class="stars" data-n="${starsN}"></canvas>${inner}</div>`;
const wireStars = root => root.querySelectorAll('canvas.stars').forEach(c => stars(c, Number(c.dataset.n)));

/* ---------------- sparkle burst (when a card appears) ---------------- */
function burst(el) {
  const c = document.createElement('canvas'); c.className = 'sparks'; el.appendChild(c);
  const r = devicePixelRatio || 1, W = c.width = c.clientWidth * r, H = c.height = c.clientHeight * r, g = c.getContext('2d');
  const cols = ['#fff', getComputedStyle(document.body).getPropertyValue('--a'), getComputedStyle(document.body).getPropertyValue('--c')];
  const ps = Array.from({ length: 46 }, () => { const a = Math.random() * 6.28, s = (2 + Math.random() * 7) * r; return { x: W * (.1 + Math.random() * .25), y: H * .5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2 * r, life: 1, c: cols[Math.random() * 3 | 0], z: (2 + Math.random() * 3) * r }; });
  (function f() {
    g.clearRect(0, 0, W, H); let alive = false;
    for (const p of ps) { if (p.life <= 0) continue; alive = true; p.x += p.vx; p.y += p.vy; p.vy += .18 * r; p.vx *= .97; p.life -= .018; g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c.trim() || '#fff'; g.save(); g.translate(p.x, p.y); g.rotate(p.life * 6); g.fillRect(-p.z / 2, -p.z / 2, p.z, p.z); g.restore(); }
    alive ? requestAnimationFrame(f) : c.remove();
  })();
}

};

function pop() {

  const card = $('.pop'), art = $('#art'), txt = $('#txt'), tl = $('#tl');

  const perShow = EVERY === 0 ? 1 : 3, step = (EVERY === 0 ? 9 : SHOW / perShow) * 1000;
  function showSlide(n, total, i) {

    while (!s && guard++ < ORDER.length) { s = SLIDES[ORDER[idx % ORDER.length]](); idx++; }
    if (!s) s = SLIDES.brand();
    const old = txt.querySelector('.slide'); if (old) { old.classList.add('leave'); setTimeout(() => old.remove(), 400); }
    art.querySelectorAll(':scope > *').forEach(x => { x.classList.add('hide'); setTimeout(() => x.remove(), 500); });
    const a = document.createElement('div'); a.innerHTML = s.art; const el = a.firstElementChild; el.classList.add('hide'); art.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('hide')));
    const d = document.createElement('div'); d.className = 'slide'; d.innerHTML = s.html; txt.appendChild(d); setTimeout(() => d.classList.add('in'), old ? 220 : 60);
    if (total) { tl.innerHTML = Array.from({ length: total }, (_, k) => `<i class="${k < i ? 'done' : k === i ? 'run' : ''}"><b style="animation-duration:${step}ms"></b></i>`).join(''); }
  }
  async function cycle() {
    if (EVERY === 0) { card.classList.add('on'); burst($('.sc', anchor)); for (;;) { showSlide(); await wait(step); } }
    for (;;) {
      card.classList.remove('out'); txt.innerHTML = ''; art.innerHTML = '';
      showSlide(0, perShow, 0); await wait(80); card.classList.add('on'); setTimeout(() => burst($('.sc', anchor)), 350);
      for (let i = 1; i < perShow; i++) { await wait(step); showSlide(0, perShow, i); }
      await wait(step); card.classList.add('out'); card.classList.remove('on'); await wait(700);
      await wait(Math.max(2, EVERY - SHOW) * 1000);

}
const wait = ms => new Promise(r => setTimeout(r, ms));

    <div class="center"><div class="biglogo"><img src="${LOGO}" alt=""></div><div class="kicker"><span class="dot"></span>${esc(T[0])}${NAME ? ` · ${esc(NAME)}` : ''}</div><h1 class="grad-text">${esc(title)}</h1>${until ? '<div class="timer" id="timer"></div>' : ''}</div>
    <div class="row">
      ${shell('card getc', `${QRON ? `<div class="q">${qrSvg()}</div>` : ''}<div><small>${ic('download')}Playing on Kyoto Client</small><b class="grad-text">Get it free</b><code>${esc(SITE)}</code><p>Kyoto Launcher + Kyoto Studio for Windows</p></div>`, 20)}
      ${shell('card featc', `<small>${ic('sparkle')}Inside Kyoto</small><div class="fslot" id="fslot"></div><div class="fdots" id="fdots"></div>`, 20)}

  $('#root').appendChild(s); wireStars(s); stars($('canvas.fx', s), 140, true);
  fillTicker($('#trk'), 60);
  // feature carousel
  let fi = 0; const slot = $('#fslot'), dots = $('#fdots');
  dots.innerHTML = FEATURES.map(() => '<i></i>').join('');
  const nextF = () => { const f = FEATURES[fi % FEATURES.length]; const old = slot.firstElementChild; if (old) { old.classList.add('gone'); setTimeout(() => old.remove(), 800); }
    const d = document.createElement('div'); d.className = 'hide'; d.innerHTML = `<div class="fi">${ic(f[0])}</div><div><b>${esc(f[1])}</b><p>${esc(f[2])}</p></div>`; slot.appendChild(d); requestAnimationFrame(() => requestAnimationFrame(() => d.classList.remove('hide')));
    [...dots.children].forEach((x, k) => x.classList.toggle('on', k === fi % FEATURES.length)); fi++; };
  nextF(); setInterval(nextF, 6000);
  // live / me card
  const live = () => { const c = DATA.card; $('#livebox').innerHTML = c ? `<small><span class="dot g"></span>Your streamer</small><div class="me" style="margin-top:14px"><img src="https://mc-heads.net/avatar/${encodeURIComponent(c.name)}/86" alt=""><div><b>${esc(c.displayName || c.name)}</b><span>Level ${c.level} · ${esc(c.title)}</span></div></div><p style="margin-top:16px">${c.stats.achievements} achievements · ${fmt(c.stats.hours)} h played</p>`
    : `<small><span class="dot g"></span>Live right now</small><div class="num grad-text">${DATA.online == null ? '—' : fmt(DATA.online)}</div><p>players on Kyoto${DATA.users ? ` · ${fmt(DATA.users)} total` : ''}</p>`; };
  live(); document.addEventListener('ky:data', () => { live(); fillTicker($('#trk'), 60); });
  // countdown with flipping digits
  if (until) {
    const el = $('#timer'); let last = '';
    const tick = () => { const left = Math.max(0, until - Date.now()), m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
      const str = left ? `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : (kind === 'end' ? 'BYE!' : 'NOW!');
      if (str !== last) { el.innerHTML = [...str].map((ch, k) => ch === ':' ? '<i>:</i>' : `<span class="${ch !== last[k] ? 'flip' : ''}">${ch}</span>`).join(''); last = str; } };

/* ================= live game overlays: money challenge, stats, alerts, counters =================
   They read what Kyoto Client sends while you play (turn on "Live Stats For Overlays" in the Kyoto menu).
   ?k=<overlay key> from the setup page. It only unlocks these numbers, nothing else. */
const KEY = /^[\w-]{8,20}$/.test(Q.get('k') || '') ? Q.get('k') : '';
const LV = { on: false, d: null, since: 0, subs: [] };
const short = n => { n = Number(n) || 0; const a = Math.abs(n), sg = n < 0 ? '-' : '';
  for (const [v, u] of [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) if (a >= v) return sg + (a / v).toFixed(a / v >= 100 ? 0 : a / v >= 10 ? 1 : 2).replace(/\.?0+$/, '') + u;
  return sg + Math.round(a).toLocaleString('en-US'); };
const parseAmt = s => { const m = /^\s*([\d.,]+)\s*([kmbt]?)\s*$/i.exec(String(s || '')); if (!m) return 0; return parseFloat(m[1].replace(/,/g, '')) * ({ k: 1e3, m: 1e6, b: 1e9, t: 1e12 }[m[2].toLowerCase()] || 1); };
async function pollLive() {
  if (!KEY) return;
  try {
    const r = await get('/overlay/live?k=' + encodeURIComponent(KEY) + '&since=' + LV.since);
    LV.on = !!r.on; LV.name = r.name || LV.name;
    if (r.on) { LV.d = r; if (r.events && r.events.length) { LV.since = Math.max(...r.events.map(e => e.at)); if (LV.first) r.events.forEach(e => LV.subs.forEach(f => f(e))); } }
    LV.first = true;
    document.dispatchEvent(new Event('ky:live'));
  } catch (e) { /* server asleep */ }
}
if (KEY && Q.get('demo') !== '1') { pollLive(); setInterval(pollLive, 3000); }
else if (Q.get('demo') === '1') { // preview on the setup page: pretend numbers
  const st = parseAmt(Q.get('start')) || 1e6, d = { on: true, server: 'DonutSMP', money: st * 1.38, session: st * .38, perHour: st * .21, shards: 1240, kills: 7, deaths: 2, bounty: 2.5e6, hearts: 14, elo: 1312 };
  LV.on = true; LV.d = d; LV.name = NAME || 'heffm'; let n = 0;
  setTimeout(() => document.dispatchEvent(new Event('ky:live')), 60);
  setInterval(() => { n++; d.money += st * .02; d.session += st * .02; if (n % 3 === 0) d.kills++; document.dispatchEvent(new Event('ky:live'));
    if (n % 4 === 1) { const ev = [{ type: 'bounty', text: '$2.5M bounty on me!' }, { type: 'sold', text: 'Elytra for $1.2M' }, { type: 'kill', text: 'Killed Notch' }, { type: 'death', text: 'Killed by jeb_' }][(n / 4 | 0) % 4]; LV.subs.forEach(f => f(ev)); } }, 2500);
}
// smooth number tween
function tweenNum(el, to, f = short) { const from = Number(el.dataset.v ?? to), t0 = performance.now(), dur = 1200; el.dataset.v = to;
  if (from === to) { el.textContent = f(to); return; }
  (function s(t) { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = f(from + (to - from) * e); if (k < 1) requestAnimationFrame(s); })(t0); }
const waitLine = () => KEY ? `<div class="wait"><span class="dot"></span>Waiting for the game... turn on <b>&nbsp;Live Stats For Overlays&nbsp;</b> in Kyoto</div>` : `<div class="wait">Add your overlay key from kyoto-server.onrender.com/overlay/setup</div>`;

/* ---- money challenge: "2xing my money" from START to GOAL ---- */
function challenge() {
  const from = Q.get('from') === 'session' ? 'session' : 'balance';
  const START = parseAmt(Q.get('start')), GOAL = parseAmt(Q.get('goal')) || (START ? START * 2 : 0);
  const TITLE = Q.get('title') || (START && GOAL && Math.abs(GOAL / START - 2) < .01 ? '2xing my money' : 'Money challenge');
  const UNIT = (Q.get('unit') || '$').slice(0, 3);
  const anchor = document.createElement('div'); anchor.className = 'anchor ' + POS;
  anchor.innerHTML = `<div class="sc">${shell('chal', `<div class="chead"><div class="ttl grad-text">${esc(TITLE)}</div><div class="mult" id="mult">x1.00</div></div>
    <div class="now"><b class="money" id="now">${UNIT}0</b><span id="delta"></span></div>
    <div class="track2"><div class="fill" id="fill"></div><div class="pct" id="pct">0%</div></div>
    <div class="ends"><span>Start <b>${UNIT}${short(START)}</b></span><span>Goal <b>${UNIT}${short(GOAL)}</b></span></div>
    <div class="meta" id="meta"></div>`, 30)}</div>`;
  $('#root').appendChild(anchor); wireStars(anchor);
  const card = $('.chal'); let won = false;
  const draw = () => {
    const d = LV.d;
    if (!LV.on || !d) { $('#meta').innerHTML = waitLine(); return; }
    const cur = from === 'session' ? START + Math.max(0, d.session) : d.money >= 0 ? d.money : START + Math.max(0, d.session);
    tweenNum($('#now'), cur, v => UNIT + short(v));
    const p = GOAL > START ? Math.max(0, Math.min(1, (cur - START) / (GOAL - START))) : 0;
    $('#fill').style.width = (p * 100).toFixed(1) + '%'; $('#pct').textContent = Math.floor(p * 100) + '%';
    $('#mult').textContent = 'x' + (START > 0 ? (cur / START).toFixed(2) : '1.00');
    const dl = cur - START; $('#delta').innerHTML = `<span class="${dl >= 0 ? 'up' : 'down'}">${dl >= 0 ? '+' : ''}${UNIT}${short(dl)}</span>`;
    const left = GOAL - cur, eta = d.perHour > 0 && left > 0 ? left / d.perHour : 0;
    $('#meta').innerHTML = [d.perHour > 0 ? `<span>${ic('up')}${UNIT}${short(d.perHour)} / hour</span>` : '', eta ? `<span>${ic('clock')}~${eta < 1 ? Math.max(1, Math.round(eta * 60)) + ' min' : eta.toFixed(1) + ' h'} to go</span>` : '', left > 0 ? `<span>${ic('target')}${UNIT}${short(left)} left</span>` : '', d.server ? `<span>${ic('home')}${esc(d.server)}</span>` : ''].join('');
    if (p >= 1 && !won) { won = true; card.classList.add('won'); burst($('.sc', anchor)); setTimeout(() => burst($('.sc', anchor)), 600); }
    if (p < 1) { won = false; card.classList.remove('won'); }
  };
  draw(); document.addEventListener('ky:live', draw);
}

/* ---- live stats card ---- */
function statsCard() {

  anchor.innerHTML = `<div class="sc">${shell('stats2', `<div class="hd"><img id="hd" alt="" src="${LOGO}"><div><b class="grad-text" id="who">Kyoto Client</b><span id="srv"><span class="dot"></span>Live stats</span></div></div><div class="grid" id="grid"></div>`, 24)}</div>`;
  $('#root').appendChild(anchor); wireStars(anchor);
  const want = (Q.get('show') && isNaN(Number(Q.get('show'))) ? Q.get('show') : '').split(',').filter(Boolean);
  const prev = {};
  const draw = () => {
    const d = LV.d;
    if (LV.name && LV.name !== '?') { $('#who').textContent = LV.name; $('#hd').src = 'https://mc-heads.net/avatar/' + encodeURIComponent(LV.name) + '/46'; }

    $('#srv').innerHTML = `<span class="dot g"></span>${esc(d.server || 'Playing')}`;
    const all = { money: ['coin', 'Balance', d.money >= 0 ? '$' + short(d.money) : null], session: ['up', 'This stream', d.session !== -1 ? (d.session >= 0 ? '+$' : '-$') + short(Math.abs(d.session)) : null, d.session >= 0 ? 'g' : 'r'], perhour: ['clock', 'Per hour', d.perHour > 0 ? '$' + short(d.perHour) : null],
      shards: ['gem', 'Shards', d.shards >= 0 ? short(d.shards) : null], kills: ['sword', 'Kills', d.kills >= 0 ? String(d.kills) : null], deaths: ['skull', 'Deaths', d.deaths >= 0 ? String(d.deaths) : null, 'r'],
      bounty: ['target', 'Bounty on me', d.bounty > 0 ? '$' + short(d.bounty) : null], hearts: ['heart', 'Hearts', d.hearts > 0 ? String(d.hearts) : null], elo: ['trophy', 'Elo', d.elo > 0 ? String(Math.round(d.elo)) : null] };
    const keys = (want.length ? want : Object.keys(all)).filter(k => all[k] && all[k][2] != null).slice(0, 6);
    $('#grid').innerHTML = keys.map(k => `<div class="cell${prev[k] !== undefined && prev[k] !== all[k][2] ? ' bump' : ''}"><small>${ic(all[k][0])}${all[k][1]}</small><b class="money ${all[k][3] || ''}">${esc(all[k][2])}</b></div>`).join('');
    keys.forEach(k => prev[k] = all[k][2]);

  };

}

/* ---- big pop-up alerts from game events ---- */
function alerts() {
  const anchor = document.createElement('div'); anchor.className = 'anchor ' + POS;
  anchor.innerHTML = `<div class="sc">${shell('alert2', `<div class="ai" id="ai"></div><div><small id="ak"></small><b id="at"></b></div>`, 26)}</div>`;
  $('#root').appendChild(anchor); wireStars(anchor);
  const card = $('.alert2'), queue = []; let busy = false;
  const STYLE = { bounty: ['target', 'Bounty on you', 'bad'], death: ['skull', 'Died', 'bad'], kill: ['sword', 'Kill', 'good'], sold: ['coin', 'Sold', 'good'], order: ['coin', 'Order filled', 'good'], pay: ['coin', 'Got paid', 'good'], money: ['up', 'Money', 'good'], goal: ['trophy', 'Goal hit', 'good'] };
  const only = (Q.get('events') || '').split(',').filter(Boolean);
  async function run() {
    if (busy) return; busy = true;
    while (queue.length) {
      const e = queue.shift(), st = STYLE[e.type] || ['sparkle', e.type, ''];
      card.className = 'shell alert2 ' + st[2]; $('#ai').innerHTML = ic(st[0]); $('#ak').textContent = st[1]; $('#at').textContent = e.text || '';
      await wait(30); card.classList.add('on'); setTimeout(() => burst($('.sc', anchor)), 300);
      await wait(Math.max(3, Number(Q.get('hold')) || 5) * 1000); card.classList.add('out'); card.classList.remove('on'); await wait(600);
    }
    busy = false;
  }
  LV.subs.push(e => { if (only.length && !only.includes(e.type)) return; if (queue.length < 6) queue.push(e); run(); });
  if (Q.get('test') === '1') setTimeout(() => LV.subs.forEach(f => f({ type: 'bounty', text: '$2.5M bounty on you!' })), 1500);
}

/* ---- one big counter: deaths, kills, money, bounty, session ---- */
function counter() {
  const what = (Q.get('what') || 'deaths').toLowerCase();
  const M = { deaths: ['skull', 'Deaths', d => d.deaths, String], kills: ['sword', 'Kills', d => d.kills, String], money: ['coin', 'Balance', d => d.money, v => '$' + short(v)], session: ['up', 'Made this stream', d => d.session, v => '+$' + short(v)],
    perhour: ['clock', 'Money / hour', d => d.perHour, v => '$' + short(v)], bounty: ['target', 'Bounty on me', d => d.bounty, v => '$' + short(v)], shards: ['gem', 'Shards', d => d.shards, short], hearts: ['heart', 'Hearts', d => d.hearts, String], elo: ['trophy', 'Elo', d => d.elo, v => String(Math.round(v))] }[what] || null;
  if (!M) return;

  anchor.innerHTML = `<div class="sc">${shell('counter2', `<div class="ci">${ic(M[0])}</div><div><small>${esc(label)}</small><b class="money grad-text" id="cv">—</b></div>`, 16)}</div>`;
  $('#root').appendChild(anchor); wireStars(anchor);

}

({ pop, badge, bar, qr: qrCard, scene, challenge, stats: statsCard, alerts, counter }[MODE] || pop)();
