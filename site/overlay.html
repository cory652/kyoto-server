<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kyoto Client - stream overlay</title>
<!--
  OBS / TikTok LIVE Studio: Browser Source, 1920 x 1080, transparent background.
  URL options:
    ?every=30   seconds between pop-ups (default 30, 0 = always on screen)
    ?show=10    seconds it stays up (default 10)
    ?pos=br     corner: br, bl, tr, tl or bottom (centered)
    ?scale=1    size (0.6 - 1.6)
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --s: 1; --pink: #ff8fd0; --violet: #a98bff; --sky: #8fd8ff; }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: Poppins, "Segoe UI", system-ui, sans-serif; }
  .wrap { position: fixed; padding: 60px; transform-origin: inherit; }
  .br { right: 0; bottom: 0; transform-origin: right bottom; } .bl { left: 0; bottom: 0; transform-origin: left bottom; }
  .tr { right: 0; top: 0; transform-origin: right top; } .tl { left: 0; top: 0; transform-origin: left top; }
  .bottom { left: 50%; bottom: 0; transform: translateX(-50%); transform-origin: center bottom; }
  .scale { transform: scale(var(--s)); transform-origin: inherit; }

  /* the card */
  .card { position: relative; width: 640px; height: 172px; border-radius: 30px; isolation: isolate;
    opacity: 0; transform: translateX(var(--from, 120px)) scale(.9) rotate(var(--tilt, 2deg)); filter: blur(10px);
    transition: opacity .5s ease, transform .9s cubic-bezier(.16, 1.3, .3, 1), filter .5s ease; }
  .bl .card, .tl .card { --from: -120px; --tilt: -2deg; } .bottom .card { --from: 0; --tilt: 0deg; }
  .card.on { opacity: 1; transform: none; filter: none; }
  .card.out { opacity: 0; transform: translateY(26px) scale(.95); filter: blur(6px); transition: opacity .45s ease, transform .5s ease, filter .45s; }

  /* spinning aurora border */
  .border { position: absolute; inset: -2px; border-radius: 32px; z-index: -2; overflow: hidden; }
  .border::before { content: ''; position: absolute; inset: -60%; background: conic-gradient(from 0deg, var(--pink), var(--violet), var(--sky), #fff6, var(--pink));
    animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .bg { position: absolute; inset: 0; border-radius: 30px; z-index: -1; overflow: hidden;
    background: radial-gradient(140% 120% at 0% 0%, #31164f 0%, #140b26 48%, #07050d 100%); box-shadow: 0 30px 90px rgba(0,0,0,.55); }
  .aurora { position: absolute; inset: -40%; background:
      radial-gradient(30% 40% at 20% 40%, rgba(255,143,208,.42), transparent 70%),
      radial-gradient(30% 40% at 70% 70%, rgba(143,216,255,.30), transparent 70%),
      radial-gradient(25% 35% at 80% 20%, rgba(169,139,255,.35), transparent 70%);
    filter: blur(14px); animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(8%, -6%) rotate(12deg); } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.14) 48%, transparent 60%); transform: translateX(-120%); }
  .card.on .shine { animation: sweep 1.6s .5s ease-out; }
  @keyframes sweep { to { transform: translateX(120%); } }

  .row { position: absolute; inset: 0; display: flex; align-items: center; gap: 26px; padding: 0 30px; }
  .logo { position: relative; width: 112px; height: 112px; flex: none; }
  .logo img { position: relative; width: 100%; height: 100%; border-radius: 28px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35), 0 14px 40px rgba(255,120,210,.45); animation: bob 3.4s ease-in-out infinite; }
  .logo .halo { position: absolute; inset: -14px; border-radius: 40px; border: 2px solid rgba(255,190,235,.5); animation: ping 2.4s ease-out infinite; }
  .logo .halo.b { animation-delay: 1.2s; }
  @keyframes ping { from { transform: scale(.88); opacity: .9; } to { transform: scale(1.28); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-3deg); } }
  .orbit { position: absolute; inset: -10px; animation: spin 5s linear infinite; }
  .orbit i { position: absolute; top: 0; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #fff, 0 0 26px var(--pink); }

  .txt { min-width: 0; flex: 1; color: #fff; }
  .top { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 13px; font-weight: 800; letter-spacing: .18em; padding: 5px 11px; border-radius: 999px; color: #1a0f22;
    background: linear-gradient(90deg, #ffe3a6, #ffb6e1); box-shadow: 0 6px 18px rgba(255,170,220,.4); }
  .live { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; letter-spacing: .14em; color: #ffc8ea; }
  .live b { width: 8px; height: 8px; border-radius: 50%; background: #ff5fa8; box-shadow: 0 0 0 0 rgba(255,95,168,.7); animation: dot 1.6s infinite; }
  @keyframes dot { 70% { box-shadow: 0 0 0 10px rgba(255,95,168,0); } }
  .title { margin-top: 6px; font-size: 46px; font-weight: 800; line-height: 1.02; letter-spacing: .01em; white-space: nowrap;
    background: linear-gradient(90deg, #fff 0%, #ffd6f0 30%, #d8c8ff 60%, #fff 100%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sheen 4s linear infinite; filter: drop-shadow(0 4px 18px rgba(255,150,220,.35)); }
  @keyframes sheen { to { background-position: -220% 0; } }
  .sub { position: relative; height: 30px; margin-top: 8px; overflow: hidden; }
  .sub span { position: absolute; left: 0; top: 0; font-size: 20px; font-weight: 500; color: #e6ddf5; white-space: nowrap; opacity: 0; transform: translateY(100%);
    transition: transform .55s cubic-bezier(.2,.9,.3,1), opacity .45s; }
  .sub span.in { opacity: 1; transform: none; } .sub span.gone { opacity: 0; transform: translateY(-100%); }
  .sub span b { color: #fff; font-weight: 700; }
  .url { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 10px; margin-left: 4px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; font-weight: 700; }
  .bar { position: absolute; left: 30px; right: 30px; bottom: 14px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--pink), var(--violet), var(--sky)); transform-origin: left; }
  .card.on .bar i { animation: drain var(--show) linear forwards; }
  .always .bar { display: none; }
  @keyframes drain { to { transform: scaleX(0); } }
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="scale">
  <div class="card" id="card">
    <div class="border"></div>
    <div class="bg"><div class="aurora"></div><canvas id="stars"></canvas><div class="shine"></div></div>
    <div class="row">
      <div class="logo"><span class="halo"></span><span class="halo b"></span><div class="orbit"><i></i></div><img src="/img/logos/logo_k_starry.png" alt=""></div>
      <div class="txt">
        <div class="top"><span class="badge">FREE</span><span class="live"><b></b>PLAYING ON</span></div>
        <div class="title">Kyoto Client</div>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="bar"><i></i></div>
  </div>
</div></div>
<script>
  const q = new URLSearchParams(location.search);
  const every = Math.max(0, Number(q.get('every') ?? 30));          // seconds
  const show = Math.max(4, Math.min(120, Number(q.get('show') ?? 10)));
  const pos = ['br', 'bl', 'tr', 'tl', 'bottom'].includes(q.get('pos')) ? q.get('pos') : 'br';
  const scale = Math.max(.6, Math.min(1.6, Number(q.get('scale')) || 1));
  const wrap = document.getElementById('wrap'), card = document.getElementById('card'), sub = document.getElementById('sub');
  wrap.classList.add(pos); document.documentElement.style.setProperty('--s', scale);
  card.style.setProperty('--show', show + 's');
  if (pos === 'bottom') { wrap.style.transform = `translateX(-50%) scale(${scale})`; wrap.querySelector('.scale').style.transform = 'none'; }

  const LINES = [
    'The free <b>Minecraft client</b> that\'s just a mod',
    'Free capes · synced lyrics · video screens',
    'Custom skies, friends, calls and more',
    'Download it at <span class="url">kyotoclient.cc</span>'
  ];
  sub.innerHTML = LINES.map(l => `<span>${l}</span>`).join('');
  const spans = [...sub.children];
  let li = -1, lineTimer = null;
  function nextLine() {
    if (li >= 0) { spans[li].classList.remove('in'); spans[li].classList.add('gone'); const old = spans[li]; setTimeout(() => old.classList.remove('gone'), 600); }
    li = (li + 1) % spans.length; spans[li].classList.add('in');
  }

  // twinkling stars + a shooting star now and then (only while the card is showing)
  const cv = document.getElementById('stars'), g = cv.getContext('2d');
  let W, H, stars = [], shoot = null, running = false;
  function size() { const d = Math.min(2, devicePixelRatio || 1); W = cv.width = card.clientWidth * d; H = cv.height = card.clientHeight * d;
    stars = Array.from({ length: 55 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() ** 2 * 1.4 + .4) * d, s: Math.random() * 1.5 + .4, o: Math.random() * 6 })); }
  function frame(now) {
    if (!running) return;
    g.clearRect(0, 0, W, H);
    for (const s of stars) { g.globalAlpha = .3 + .7 * Math.abs(Math.sin(now / 900 * s.s + s.o)); g.fillStyle = '#fff'; g.beginPath(); g.arc(s.x, s.y, s.r, 0, 7); g.fill(); }
    if (!shoot && Math.random() < .01) shoot = { x: W * (.3 + Math.random() * .7), y: Math.random() * H * .4, t: 0 };
    if (shoot) {
      shoot.t += 1; const k = shoot.t / 40, x = shoot.x - k * W * .45, y = shoot.y + k * H * .5;
      const gr = g.createLinearGradient(x, y, x + 80, y - 90 * H / W); gr.addColorStop(0, `rgba(255,255,255,${1 - k})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.globalAlpha = 1; g.strokeStyle = gr; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 80, y - 90 * H / W); g.stroke();
      if (k >= 1) shoot = null;
    }
    requestAnimationFrame(frame);
  }
  size();

  function showAd() {
    running = true; requestAnimationFrame(frame);
    card.classList.remove('out'); void card.offsetWidth; card.classList.add('on');
    li = -1; spans.forEach(s => s.classList.remove('in', 'gone')); nextLine();
    clearInterval(lineTimer); lineTimer = setInterval(nextLine, every === 0 ? 4000 : Math.max(2200, show * 1000 / LINES.length));
    if (every === 0) { card.classList.add('always'); return; }
    setTimeout(() => {
      clearInterval(lineTimer);
      card.classList.remove('on'); card.classList.add('out');
      setTimeout(() => { running = false; }, 700);
    }, show * 1000);
  }
  // first one shortly after the source loads, then every N seconds (counted from when the last one appeared)
  setTimeout(showAd, q.get('test') ? 200 : 2500);
  if (every > 0) setInterval(showAd, Math.max(every, show + 2) * 1000);
</script>
</body>
</html>
